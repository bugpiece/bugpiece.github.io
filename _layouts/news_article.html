---
layout: default
---
<div id="main" role="main">
  {% include sidebar.html %}
  <article class="page news-article">
    <div class="page__inner-wrap">
      <p class="news-back"><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
      {% include news-gallery.html item=page %}
      <header>
        <time class="news-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="page__title news-title">{{ page.title | escape }}</h1>
      </header>
      <div class="page__content news-body">{{ content }}</div>
    </div>
  </article>
</div>
